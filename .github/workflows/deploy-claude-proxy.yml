name: Deploy claude-proxy edge function

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── Step 1: Download existing live function source ──────────────────
      - name: Download existing function source
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions download claude-proxy \
            --project-ref wopyucsdaeamywscxfzs
          echo "Downloaded:"
          cat supabase/functions/claude-proxy/index.ts

      # ── Step 2: Apply patches (caching + logging) ───────────────────────
      - name: Apply caching + logging patches
        run: node scripts/patch-claude-proxy.js

      - name: Show patched source
        run: cat supabase/functions/claude-proxy/index.ts

      # ── Step 3: Create ai_usage_log table (idempotent) ──────────────────
      - name: Create ai_usage_log table
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl -sf -X POST \
            "https://api.supabase.com/v1/projects/wopyucsdaeamywscxfzs/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "create table if not exists public.ai_usage_log (id bigint generated always as identity primary key, shop_id text, model text, tier text, input_tokens int default 0, output_tokens int default 0, cache_read_input_tokens int default 0, cache_creation_input_tokens int default 0, created_at timestamptz default now()); alter table public.ai_usage_log enable row level security; grant all on public.ai_usage_log to service_role;"
            }' \
            && echo "Table created/verified"

      # ── Step 4: Deploy ───────────────────────────────────────────────────
      - name: Deploy patched claude-proxy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy claude-proxy \
            --project-ref wopyucsdaeamywscxfzs \
            --no-verify-jwt
          echo "Deploy complete"

      # ── Step 5: Verify prompt caching (two consecutive identical calls) ──
      # Call #1 should populate the cache (cache_creation_input_tokens > 0).
      # Call #2 should read from cache (cache_read_input_tokens > 0).
      - name: Verify prompt caching
        run: |
          FUNC_URL="https://wopyucsdaeamywscxfzs.supabase.co/functions/v1/claude-proxy"
          # Anthropic caching requires >= 1024 tokens; pad system prompt to ~1100 tokens.
          # Roughly 4 chars/token so we need ~4400 chars minimum.
          SYS="You are ZyroNex AI Assistant, a highly capable AI for e-commerce shop owners. Your role is to help shop owners manage their stores, answer customer queries, assist with product descriptions, handle support tickets, and provide business insights. You must always respond in a professional, friendly, and concise manner. You have deep knowledge of e-commerce best practices, inventory management, customer service, digital marketing, and product catalogue optimisation. When answering questions, be factual, helpful, and avoid making up information you do not have. You understand Greek e-commerce regulations, EU consumer protection laws, VAT requirements, and cross-border shipping logistics. You are also knowledgeable about Shopify, WooCommerce, and custom e-commerce platforms. You help shop owners write compelling product titles and descriptions, set competitive prices, manage stock alerts, process refund requests, answer FAQ questions for customers, generate marketing copy, and analyse performance data. You maintain a warm, approachable tone while remaining efficient and accurate. If you do not know the answer to something, you say so honestly rather than guessing. You respect the shop owner's time and aim to give answers that are immediately actionable. You support multiple languages including Greek, English, German, and French. You are trained to recognise when a query requires escalation to a human agent and will recommend that politely when necessary. You understand the ZyroNex platform features including: smart product search, automated promotions, loyalty points, multi-warehouse stock management, order tracking integrations, and AI-powered demand forecasting. You are the first-line AI assistant; your responses will be shown directly to customers or shop owners, so accuracy and professionalism are critical. Respond to this cache verification ping with only the word PONG."
          PAYLOAD="{\"model\":\"claude-haiku-4-5-20251001\",\"max_tokens\":16,\"system\":\"$SYS\",\"messages\":[{\"role\":\"user\",\"content\":\"PING\"}]}"

          echo "=== Call #1 (cache population) ==="
          R1=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$FUNC_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          HTTP1=$(echo "$R1" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY1=$(echo "$R1" | grep -v "HTTP_STATUS:")
          echo "HTTP status: $HTTP1"
          echo "Raw response: $BODY1"
          echo "$BODY1" | python3 -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            u = d.get('usage', {})
            print(f'  input_tokens:                  {u.get(\"input_tokens\", \"N/A\")}')
            print(f'  output_tokens:                 {u.get(\"output_tokens\", \"N/A\")}')
            print(f'  cache_creation_input_tokens:   {u.get(\"cache_creation_input_tokens\", \"N/A\")}')
            print(f'  cache_read_input_tokens:       {u.get(\"cache_read_input_tokens\", \"N/A\")}')
          except Exception as e:
            print(f'  Parse error: {e}')
          " || true

          echo ""
          echo "=== Call #2 (cache read) ==="
          R2=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$FUNC_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          HTTP2=$(echo "$R2" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY2=$(echo "$R2" | grep -v "HTTP_STATUS:")
          echo "HTTP status: $HTTP2"
          echo "Raw response: $BODY2"
          echo "$BODY2" | python3 -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            u = d.get('usage', {})
            print(f'  input_tokens:                  {u.get(\"input_tokens\", \"N/A\")}')
            print(f'  output_tokens:                 {u.get(\"output_tokens\", \"N/A\")}')
            print(f'  cache_creation_input_tokens:   {u.get(\"cache_creation_input_tokens\", \"N/A\")}')
            print(f'  cache_read_input_tokens:       {u.get(\"cache_read_input_tokens\", \"N/A\")}')
          except Exception as e:
            print(f'  Parse error: {e}')
          " || true

          echo ""
          C2_CACHE=$(echo "$BODY2" | python3 -c "import sys,json; u=json.load(sys.stdin).get('usage',{}); print(u.get('cache_read_input_tokens',0))" 2>/dev/null || echo "0")
          if [ "$C2_CACHE" -gt 0 ] 2>/dev/null; then
            echo "CACHE VERIFIED: Call #2 cache_read_input_tokens=$C2_CACHE"
          else
            echo "CACHE NOT CONFIRMED: cache_read_input_tokens=$C2_CACHE (may need warm-up or system prompt too short)"
          fi
