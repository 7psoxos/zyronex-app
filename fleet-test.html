<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet Map Test</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0e14}
  #map{position:fixed;inset:0;width:100%;height:100%;background:#0b0e14}
  #diag{
    position:fixed;left:8px;top:8px;z-index:99999;
    background:rgba(0,0,0,.78);color:#39ff14;
    font:12px/1.5 ui-monospace,Menlo,monospace;
    padding:9px 11px;border-radius:9px;white-space:pre;
    border:1px solid rgba(57,255,20,.35);max-width:90vw
  }
  #reload{
    position:fixed;right:8px;top:8px;z-index:99999;
    background:rgba(0,0,0,.78);color:#fff;border:1px solid rgba(255,255,255,.3);
    font:13px ui-monospace,monospace;padding:9px 13px;border-radius:9px;cursor:pointer
  }
</style>
</head>
<body>
  <div id="map"></div>
  <div id="diag">loading Leaflet…</div>
  <button id="reload" type="button">↻ Recheck</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var diag = document.getElementById('diag');

    function report(tag){
      var m = document.getElementById('map');
      var sz = (window.__map && window.__map.getSize) ? window.__map.getSize() : null;
      diag.textContent =
        '[' + tag + ']  ' + new Date().toLocaleTimeString() + '\n' +
        'leaflet : ' + (window.L ? 'LOADED ' + (L.version || '') : 'MISSING (CDN blocked?)') + '\n' +
        'window  : ' + window.innerWidth + ' x ' + window.innerHeight + '\n' +
        '#map box: ' + m.clientWidth + ' x ' + m.clientHeight + '\n' +
        'getSize : ' + (sz ? (Math.round(sz.x) + ' x ' + Math.round(sz.y)) : '-') + '\n' +
        'dpr     : ' + (window.devicePixelRatio || 1);
    }

    function init(){
      if (!window.L){ diag.textContent = 'Leaflet MISSING — το CDN (unpkg) δεν φόρτωσε.'; return; }

      var map = L.map('map', { zoomControl: true }).setView([39.6390, 22.4191], 14);
      window.__map = map;

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 20, subdomains: 'abcd', attribution: '© CARTO © OSM'
      }).addTo(map);

      report('init');
      setTimeout(function(){ map.invalidateSize(); report('after 300ms'); }, 300);
      setTimeout(function(){ map.invalidateSize(); report('after 800ms'); }, 800);
      setTimeout(function(){ map.invalidateSize(); report('after 1500ms'); }, 1500);

      map.on('load', function(){ report('map load'); });
      window.addEventListener('resize', function(){ map.invalidateSize(); report('resize'); });
      document.getElementById('reload').addEventListener('click', function(){
        map.invalidateSize(); report('manual recheck');
      });
    }

    if (window.L) init();
    else window.addEventListener('load', init);
  </script>
</body>
</html>
